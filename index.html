<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>海底捞鱼</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #001a2e;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      touch-action: none;
    }

    #gameCanvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      cursor: crosshair;
    }

    #score {
      position: fixed;
      top: 20px;
      right: 30px;
      font-size: 32px;
      color: #ffd700;
      text-shadow: 0 0 20px #ffd700, 0 0 40px #ffd70060;
      z-index: 100;
    }

    #target {
      position: fixed;
      top: 60px;
      right: 30px;
      font-size: 18px;
      color: #00ffaa;
      text-shadow: 0 0 15px #00ffaa;
      z-index: 100;
    }

    #netsLeft {
      position: fixed;
      top: 70px;
      left: 30px;
      font-size: 16px;
      color: #00bfff;
      text-shadow: 0 0 15px #00bfff;
      z-index: 100;
    }

    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 26, 46, 0.95);
      z-index: 200;
    }

    #startScreen h1 {
      font-size: 56px;
      color: #00bfff;
      text-shadow: 0 0 30px #00bfff, 0 0 60px #00bfff40;
      margin-bottom: 20px;
    }

    #startScreen p {
      font-size: 16px;
      color: #aaa;
      margin-bottom: 20px;
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
    }

    #startScreen .goal {
      font-size: 24px;
      color: #ffd700;
      margin-bottom: 30px;
    }

    #startBtn {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      padding: 15px 50px;
      background: transparent;
      border: 2px solid #00bfff;
      color: #00bfff;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
      text-shadow: 0 0 10px #00bfff;
    }

    #startBtn:hover {
      background: #00bfff20;
      box-shadow: 0 0 30px #00bfff60;
    }

    #winScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 26, 46, 0.95);
      z-index: 300;
    }

    #winScreen h1 {
      font-size: 72px;
      color: #ffd700;
      text-shadow: 0 0 40px #ffd700, 0 0 80px #ffd70060;
      margin-bottom: 20px;
      animation: glow 1s infinite alternate;
    }

    @keyframes glow {
      from { text-shadow: 0 0 40px #ffd700, 0 0 80px #ffd70060; }
      to { text-shadow: 0 0 60px #ffd700, 0 0 120px #ffd70080; }
    }

    #winScreen p {
      font-size: 24px;
      color: #00ffaa;
      margin-bottom: 30px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div id="score" class="hidden">¥0</div>
  <div id="target" class="hidden">目标: ¥1000</div>
  <div id="netsLeft" class="hidden">渔网: 3</div>
  
  <div id="startScreen">
    <h1>海底捞鱼</h1>
    <p>点击屏幕发射���网捕捉鱼儿们!</p>
    <p class="goal">一条鱼 = ¥50 | 大鱼 = ¥100</p>
    <p>目标是赚够 ¥1000!</p>
    <button id="startBtn">开始捕鱼</button>
  </div>

  <div id="winScreen">
    <h1>🎉 胜利! 🎉</h1>
    <p>你赚到了 ¥1000!</p>
    <button id="startBtn" onclick="location.reload()">再玩一次</button>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const targetEl = document.getElementById('target');
    const netsLeftEl = document.getElementById('netsLeft');
    const startScreen = document.getElementById('startScreen');
    const winScreen = document.getElementById('winScreen');
    const startBtn = document.getElementById('startBtn');

    let width, height;
    let gameStarted = false;
    let gameWon = false;
    let money = 0;
    const GOAL = 1000;
    const FISH_VALUE = 50;
    const BIG_FISH_VALUE = 100;

    let fishes = [];
    let bubbles = [];
    let nets = [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    function playCatchSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(880, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(440, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    }

    function playShootSound() {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(200, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    }

    function playWinSound() {
      const notes = [523, 659, 784, 1047];
      notes.forEach((note, i) => {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(note, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.4);
        }, i * 150);
      });
    }

    const FISH_COLORS = [
      { body: '#ff6b35', fin: '#ff8c5a' },
      { body: '#00bfff', fin: '#5ac8fa' },
      { body: '#ffd700', fin: '#ffec8b' },
      { body: '#ff69b4', fin: '#ffb6c1' },
      { body: '#32cd32', fin: '#7cfc00' },
      { body: '#ff4500', fin: '#ff6347' },
      { body: '#9370db', fin: '#ba55d3' },
      { body: '#20b2aa', fin: '#40e0d0' }
    ];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    function initFishes() {
      fishes = [];
      for (let i = 0; i < 5; i++) {
        spawnFish(true, i);
      }
    }

    function spawnFish(randomPos = false, index = 0) {
      if (fishes.length >= 10) return;
      
      const size = 25 + Math.random() * 15;
      const color = FISH_COLORS[Math.floor(Math.random() * FISH_COLORS.length)];
      let x;
      
      if (randomPos) {
        x = width * 0.3 + Math.random() * (width * 0.4);
      } else {
        x = width + size;
      }
      const baseY = height * 0.2 + (index / 10) * (height * 0.6);
      const y = baseY + Math.random() * 60;
      
      const speed = 1.5 + Math.random() * 2;
      
      fishes.push({
        x, y,
        vx: -speed,
        vy: (Math.random() - 0.5) * 0.5,
        size,
        color,
        wiggle: Math.random() * Math.PI * 2,
        wiggleSpeed: 0.2 + Math.random() * 0.2,
        type: Math.floor(Math.random() * 3),
        isBig: Math.random() < 0.2
      });
    }

    function createBubbles(x, y, count = 5) {
      for (let i = 0; i < count; i++) {
        bubbles.push({
          x: x + (Math.random() - 0.5) * 30,
          y: y + (Math.random() - 0.5) * 30,
          radius: 2 + Math.random() * 4,
          vy: -1 - Math.random() * 2,
          life: 1,
          speed: 0.01 + Math.random() * 0.02
        });
      }
    }

    function shootNet(targetX, targetY) {
      if (nets.length >= 3) return;
      
      const launcherX = width / 2;
      const launcherY = 60;
      
      const angle = Math.atan2(targetY - launcherY, targetX - launcherX);
      const speed = 8;
      
      nets.push({
        x: launcherX,
        y: launcherY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        radius: 35,
        rotation: 0
      });
      
      playShootSound();
      updateUI();
    }

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, height);
      gradient.addColorStop(0, '#001a3a');
      gradient.addColorStop(0.5, '#003050');
      gradient.addColorStop(1, '#001a2e');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
      for (let i = 0; i < 50; i++) {
        const x = (i * 137) % width;
        const y = (i * 89) % height;
        const r = 1 + (i % 3);
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = 'rgba(0, 100, 150, 0.1)';
      ctx.lineWidth = 1;
      for (let y = 0; y < height; y += 80) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.bezierCurveTo(width * 0.3, y + 30, width * 0.7, y - 30, width, y);
        ctx.stroke();
      }

      ctx.fillStyle = '#001a2e';
      for (let i = 0; i < 8; i++) {
        ctx.beginPath();
        ctx.ellipse(width * (0.1 + i * 0.12), height + 20, 200, 60, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawFish(fish) {
      const { x, y, size, color, wiggle, type, isBig } = fish;
      
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(-1, 1);
      
      const wiggleOffset = Math.sin(wiggle) * 5;
      
      if (type === 0) {
        ctx.beginPath();
        ctx.ellipse(0, wiggleOffset, size * 1.2, size * 0.7, 0, 0, Math.PI * 2);
        const gradient = ctx.createRadialGradient(-size * 0.3, wiggleOffset - size * 0.2, 0, 0, wiggleOffset, size);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.3, color.body);
        gradient.addColorStop(1, shadeColor(color.body, -30));
        ctx.fillStyle = gradient;
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(-size * 0.8, 0);
        ctx.lineTo(-size * 1.5, -size * 0.6);
        ctx.lineTo(-size * 1.5, size * 0.6);
        ctx.closePath();
        ctx.fillStyle = color.fin;
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(size * 0.3, -size * 0.3);
        ctx.lineTo(size * 0.8, -size * 0.8);
        ctx.lineTo(size * 0.5, 0);
        ctx.closePath();
        ctx.fillStyle = color.fin;
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(size * 0.3, size * 0.3);
        ctx.lineTo(size * 0.8, size * 0.8);
        ctx.lineTo(size * 0.5, 0);
        ctx.closePath();
        ctx.fill();
        
      } else if (type === 1) {
        ctx.beginPath();
        ctx.moveTo(size * 1.2, 0);
        ctx.quadraticCurveTo(size * 0.5, -size * 0.8, 0, wiggleOffset);
        ctx.quadraticCurveTo(-size * 0.5, size * 0.8, -size * 1.2, 0);
        ctx.quadraticCurveTo(-size * 0.5, -size * 0.8, size * 1.2, 0);
        const gradient = ctx.createRadialGradient(0, wiggleOffset, 0, 0, wiggleOffset, size);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.5, color.body);
        gradient.addColorStop(1, shadeColor(color.body, -30));
        ctx.fillStyle = gradient;
        ctx.fill();
        
        ctx.beginPath();
        ctx.moveTo(0, -size * 0.5);
        ctx.lineTo(0, -size * 1.2);
        ctx.lineTo(size * 0.3, -size * 0.5);
        ctx.closePath();
        ctx.fillStyle = color.fin;
        ctx.fill();
        
      } else {
        ctx.beginPath();
        ctx.arc(0, wiggleOffset, size * 0.8, 0, Math.PI * 2);
        const gradient = ctx.createRadialGradient(-size * 0.2, wiggleOffset - size * 0.2, 0, 0, wiggleOffset, size * 0.8);
        gradient.addColorStop(0, '#ffffff');
        gradient.addColorStop(0.4, color.body);
        gradient.addColorStop(1, shadeColor(color.body, -40));
        ctx.fillStyle = gradient;
        ctx.fill();
        
        for (let i = 0; i < 6; i++) {
          const angle = (i / 6) * Math.PI - Math.PI / 2;
          const wx = Math.cos(angle) * size * 0.8;
          const wy = Math.sin(angle) * size * 0.5;
          ctx.beginPath();
          ctx.moveTo(0, wiggleOffset);
          ctx.quadraticCurveTo(wx * 1.5, wy + wiggleOffset, wx, wy + wiggleOffset);
          ctx.strokeStyle = color.body + '80';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      }
      
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(-size * 0.6, wiggleOffset - size * 0.1, size * 0.15, 0, Math.PI * 2);
      ctx.fill();
      
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(-size * 0.55, wiggleOffset - size * 0.15, size * 0.06, 0, Math.PI * 2);
      ctx.fill();
      
      if (isBig) {
        ctx.shadowColor = '#ffd700';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(0, 0, size + 5, 0, Math.PI * 2);
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
      
      ctx.restore();
    }

    function shadeColor(color, percent) {
      const num = parseInt(color.replace('#', ''), 16);
      const amt = Math.round(2.55 * percent);
      const R = (num >> 16) + amt;
      const G = (num >> 8 & 0x00FF) + amt;
      const B = (num & 0x0000FF) + amt;
      return '#' + (0x1000000 + 
        (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 + 
        (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 + 
        (B < 255 ? B < 1 ? 0 : B : 255)
      ).toString(16).slice(1);
    }

    function drawLauncher() {
      const x = width / 2;
      const y = 60;
      
      ctx.beginPath();
      ctx.arc(x, y, 30, 0, Math.PI * 2);
      ctx.fillStyle = '#001a2e';
      ctx.fill();
      ctx.strokeStyle = '#00ffaa';
      ctx.lineWidth = 3;
      ctx.stroke();
      
      ctx.beginPath();
      ctx.arc(x, y, 20, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(0, 255, 170, 0.5)';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      ctx.fillStyle = '#00ffaa';
      ctx.font = 'bold 16px Orbitron';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🎣', x, y);
    }

    function drawNet(net) {
      ctx.save();
      ctx.translate(net.x, net.y);
      net.rotation += 0.1;
      
      ctx.beginPath();
      ctx.arc(0, 0, net.radius + 10, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
      ctx.lineWidth = 6;
      ctx.stroke();
      
      ctx.beginPath();
      ctx.arc(0, 0, net.radius + 10, 0, Math.PI * 2);
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 5]);
      ctx.stroke();
      ctx.setLineDash([]);
      
      ctx.beginPath();
      ctx.arc(0, 0, net.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 215, 0, 0.15)';
      ctx.fill();
      
      ctx.strokeStyle = '#ffd700';
      ctx.lineWidth = 2;
      for (let i = 0; i < 8; i++) {
        const angle = (i / 8) * Math.PI * 2 + net.rotation;
        ctx.beginPath();
        ctx.moveTo(Math.cos(angle) * net.radius, Math.sin(angle) * net.radius);
        ctx.lineTo(Math.cos(angle) * (net.radius + 10), Math.sin(angle) * (net.radius + 10));
        ctx.stroke();
      }
      
      for (let r = net.radius / 3; r < net.radius; r += net.radius / 3) {
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 215, 0, 0.3)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
      
      ctx.restore();
    }

    function updateFishes() {
      for (let i = fishes.length - 1; i >= 0; i--) {
        const fish = fishes[i];
        fish.wiggle += fish.wiggleSpeed;
        
        fish.x += fish.vx;
        fish.y += fish.vy;
        
        if (fish.x < -50) {
          fishes.splice(i, 1);
          setTimeout(() => spawnFish(false), 500);
        }
      }
    }

    function updateNets() {
      for (let i = nets.length - 1; i >= 0; i--) {
        const net = nets[i];
        net.x += net.vx;
        net.y += net.vy;
        
        net.vx *= 0.98;
        net.vy *= 0.98;
        
        if (net.x < -50 || net.y < -50 || net.y > height + 50 || net.x > width + 50) {
          nets.splice(i, 1);
          updateUI();
        }
      }
    }

    function updateBubbles() {
      for (let i = bubbles.length - 1; i >= 0; i--) {
        const b = bubbles[i];
        b.y += b.vy;
        b.x += Math.sin(b.y * 0.05) * 0.5;
        b.life -= b.speed;
        if (b.life <= 0 || b.y < -10) bubbles.splice(i, 1);
      }
    }

    function checkCollisions() {
      for (let i = nets.length - 1; i >= 0; i--) {
        const net = nets[i];
        
        for (let j = fishes.length - 1; j >= 0; j--) {
          const fish = fishes[j];
          const dist = Math.sqrt(
            (net.x - fish.x) ** 2 + 
            (net.y - fish.y) ** 2
          );
          
          if (dist < net.radius + fish.size * 0.5) {
            const value = fish.isBig ? BIG_FISH_VALUE : FISH_VALUE;
            money += value;
            scoreEl.textContent = `¥${money}`;
            
            createBubbles(fish.x, fish.y, 15);
            playCatchSound();
            
            fishes.splice(j, 1);
            nets.splice(i, 1);
            
            if (money >= GOAL && !gameWon) {
              gameWon = true;
              setTimeout(() => {
                playWinSound();
                winScreen.style.display = 'flex';
              }, 500);
            }
            
            setTimeout(() => spawnFish(false), 500);
            break;
          }
        }
      }
    }

    function handleClick(e) {
      if (!gameStarted || gameWon) return;
      
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;
      
      if (clickY > 100) {
        shootNet(clickX, clickY);
      }
    }

    function draw() {
      drawBackground();
      
      bubbles.forEach(b => {
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${b.life * 0.4})`;
        ctx.fill();
      });
      
      fishes.forEach(drawFish);
      nets.forEach(drawNet);
      drawLauncher();
    }

    function updateUI() {
      scoreEl.textContent = `¥${money}`;
      targetEl.textContent = money >= GOAL ? '🎉 达标!' : `目标: ¥${GOAL}`;
      netsLeftEl.textContent = `渔网: ${3 - nets.length}`;
    }

    function loop() {
      if (!gameStarted || gameWon) return;

      updateFishes();
      updateNets();
      updateBubbles();
      checkCollisions();
      draw();
      updateUI();

      requestAnimationFrame(loop);
    }

    function startGame() {
      startScreen.classList.add('hidden');
      scoreEl.classList.remove('hidden');
      targetEl.classList.remove('hidden');
      netsLeftEl.classList.remove('hidden');
      
      gameStarted = true;
      money = 0;
      
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      
      canvas.addEventListener('mousedown', handleClick);
      canvas.addEventListener('touchstart', handleClick);
      
      updateUI();
      initFishes();
      loop();
    }

    startBtn.addEventListener('click', startGame);
    window.addEventListener('resize', resize);
    resize();
  </script>
</body>
</html>
